; PlatformIO Project Configuration File
; For more options and examples, visit:
; https://docs.platformio.org/page/projectconf.html

[common]
; Common settings shared across environments
monitor_speed = 115200         ; Sets the baud rate for the serial monitor
upload_port = COM5             ; Specifies the COM port for uploading
build_flags =                  ; Build flags for preprocessor definitions
    -D DEBUG=1                 ; Enables debug mode
    -D ESP8266                 ; Defines the ESP8266 macro
    -Iinclude                  ; Includes the "include" directory
    -Wno-noexplicit            ; Suppresses "no explicit" warnings
    -Wno-inconsistent-missing-override ; Suppresses override warnings
lib_deps =                     ; Library dependencies
    adafruit/Adafruit SSD1306@^2.5.13 ; OLED display driver
    adafruit/Adafruit GFX Library@^1.12.0 ; Graphics library for the OLED display
    adafruit/Adafruit BMP280 Library ; Library for the BMP280 pressure sensor
    sparkfun/SparkFun SCD30 Arduino Library@^1.0.20 ; Library for the SCD30 CO2 sensor

[env:esp12e]
; Environment-specific settings for the ESP-12E board
platform = espressif8266       ; Specifies the platform (ESP8266)
board = esp12e                 ; Specifies the board type (ESP-12E)
framework = arduino            ; Specifies the framework (Arduino)
monitor_speed = ${common.monitor_speed} ; Inherits monitor speed from [common]
upload_port = ${common.upload_port}     ; Inherits upload port from [common]
build_flags =                  ; Additional build flags for this environment
    ${common.build_flags}      ; Inherits build flags from [common]
    -DLOG_LEVEL=3              ; Sets the default log level (3 = LOG_INFO)
    -DRUN_I2C_SCANNER=true     ; Enables the I2C scanner functionality (true/false)
    -DRUN_DISPLAY_CHECK=true   ; Enables the display check functionality (true/false)
lib_deps = ${common.lib_deps}  ; Inherits library dependencies from [common]